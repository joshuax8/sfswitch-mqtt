services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sfswitch-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BACKEND_HOST=0.0.0.0
    volumes:
      - ./backend-data:/data
    ports:
      - "3000:3000"
      - "3001:3001"
    networks:
      - sfswitch-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sfswitch-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - sfswitch-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sfswitch-network:
    driver: bridge

volumes:
  backend-data:
